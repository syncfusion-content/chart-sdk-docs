<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selected Chart Data in a Grid</title>
    <link href="https://cdn.syncfusion.com/ej2/material.css" rel="stylesheet">
    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js"></script>
    <style>
        .selected-data-layout {
            display: grid;
            gap: 24px;
            grid-template-columns: minmax(320px, 2fr) minmax(240px, 1fr);
        }

        #element {
            min-height: 400px;
        }

        @media (max-width: 760px) {
            .selected-data-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <p>Drag over the Chart to select points.</p>

    <div class="selected-data-layout">
        <div id="element"></div>
        <div>
            <p id="selectionStatus" aria-live="polite">0 points selected.</p>
            <div id="Grid"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
