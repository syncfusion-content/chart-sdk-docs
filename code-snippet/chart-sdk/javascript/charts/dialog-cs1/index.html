<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart in Dialog</title>
    <link href="https://cdn.syncfusion.com/ej2/material.css" rel="stylesheet">
    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js"></script>
    <style>
        #dialogTarget {
            min-height: 500px;
            position: relative;
        }

        #openDialog {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <button id="openDialog" class="e-btn" type="button">
        Open chart dialog
    </button>

    <div id="dialogTarget">
        <div id="chartDialog"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
