<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exact Date Range in Chart</title>
    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js"></script>
    <style>
        .chart-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        #element {
            height: 360px;
        }
    </style>
</head>
<body>
    <div class="chart-actions">
        <button id="showLastMonth" type="button">Show Last Month</button>
        <button id="showLastDay" type="button">Show Last Day</button>
        <button id="resetRange" type="button">Reset Range</button>
    </div>

    <div id="element"></div>
    <script src="index.js"></script>
</body>
</html>
