<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronized Chart Panning</title>
    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js"></script>
    <style>
        .chart-stack {
            display: grid;
            gap: 20px;
        }

        #salesChart,
        #ordersChart {
            min-height: 320px;
        }
    </style>
</head>
<body>
    <p>Zoom either Chart, select Pan from the zoom toolbar, and drag horizontally.</p>

    <div class="chart-stack">
        <div id="salesChart"></div>
        <div id="ordersChart"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
